# RFF-specific configuration
mcr.exploration.scheduling.strategy = edu.tamu.aser.rff.RFFStrategy

mcr.exploration.preemptionbound = 0
mcr.exploration.stoponfirsterror = false

# Don't instrument these packages
mcr.instrumentation.packages.ignore.prefixes = \
  edu.tamu.aser.reex; \
  edu.tamu.aser.runtime; \
  edu.tamu.aser.scheduling; \
  edu.tamu.aser.internaljuc; \
  edu.tamu.aser.listeners; \
  edu.tamu.aser.instrumentation; \
  edu.tamu.aser.icb; \
  edu.tamu.aser.mcr; \
  edu.tamu.aser.profile; \
  jdk.internal.org.objectweb.asm; \
  org.w3c.www; \
  com.sun; \
  com.google.; \
  com.beust; \
  com.jclark; \
  com.intellij; \
  java; \
  javax; \
  junit; \
  org.hamcrest; \
  org.junit; \
  org.objectweb.asm; \
  org.apache.log4j; \
  sun; \
  sunw; \
  org.eclipse.jdt.internal.junit4; \
  org.eclipse.jdt.internal.junit; \
  rvpredict; \
  edu.tamu.aser.rvinstrumentation; \
  org.apache.commons.cli; \
  org.w3c; \
  org.eclipse; \
  org.xml; \
  org.w3c.util.CachedThread; \
  edu.illinois.imunit; \
  org.w3c.tools.sexpr; \
  org.apache.xerces

mcr.instrumentation.packages.ignore =

mcr.instrumentation.classes.ignore.prefixes = \
  $Proxy

mcr.instrumentation.classes.ignore = \
  edu.tamu.aser.rff.RFFStrategy; \
  edu.tamu.aser.rff.RFProactiveScheduler; \
  edu.tamu.aser.rff.ScheduleCorpus; \
  edu.tamu.aser.rff.ScheduleMutator; \
  edu.tamu.aser.rff.GreyboxFeedback; \
  edu.tamu.aser.rff.AbstractSchedule; \
  edu.tamu.aser.rff.ReadsFromTracker; \
  edu.tamu.aser.rff.ReadsFromConstraint; \
  edu.tamu.aser.rff.PositiveConstraintStateMachine; \
  edu.tamu.aser.rff.NegativeConstraintStateMachine; \
  edu.tamu.aser.rff.RFFDriver; \
  edu.tamu.aser.rff.RFF; \
  edu.tamu.aser.rff.RFFRuntimeBridge; \
  edu.tamu.aser.rff.RFFConfig; \
  edu.tamu.aser.rff.RFFJUnitRunner

# Only allow test classes (not RFF core classes)
mcr.instrumentation.packages.allow.prefixes = \
  edu.tamu.aser.rff.tests

mcr.instrumentation.classes.allow = \
  edu.tamu.aser.rff.RFFOrderTest; \
  edu.tamu.aser.rff.WriterThread; \
  edu.tamu.aser.rff.ReaderThread; \
  edu.tamu.aser.rff.CounterThread; \
  edu.tamu.aser.rff.TestProperties; \
  edu.tamu.aser.rff.RFFRaceTest; \
  edu.tamu.aser.rff.RFFRaceTest$1; \
  edu.tamu.aser.rff.SimpleRaceTest

mm = SC
dep_mcr = false
plus = false
opt_mcr = false
debug = true

mcr.exploration.listeners =
